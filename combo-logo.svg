<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <radialGradient id="comboBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>
    <linearGradient id="cBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffd0"/>
      <stop offset="30%" stop-color="#00e5a3"/>
      <stop offset="100%" stop-color="#008b74"/>
    </linearGradient>
    <filter id="cGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Group scaled and positioned at (40, 30) -->
  <g transform="translate(40, 30) scale(0.48)">
    <circle cx="250" cy="250" r="230" fill="url(#comboBg)" stroke="#15263c" stroke-width="3"/>
    <circle cx="250" cy="250" r="215" fill="none" stroke="#00e5a3" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6,6"/>
    <line x1="90" y1="385" x2="410" y2="385" stroke="#00e5a3" stroke-width="2" stroke-opacity="0.4"/>
    <polyline points="130,240 190,140 250,290 310,140 370,240" fill="none" stroke="#00e5a3" stroke-width="2" stroke-opacity="0.5"/>

    <rect x="112" y="240" width="36" height="145" rx="18" fill="url(#cBarGrad)"/>
    <rect x="172" y="140" width="36" height="245" rx="18" fill="url(#cBarGrad)"/>
    <rect x="232" y="290" width="36" height="95" rx="18" fill="url(#cBarGrad)"/>
    <rect x="292" y="140" width="36" height="245" rx="18" fill="url(#cBarGrad)"/>
    <rect x="352" y="240" width="36" height="145" rx="18" fill="url(#cBarGrad)"/>

    <circle cx="130" cy="240" r="13" fill="#00ffd0" filter="url(#cGlow)"/>
    <circle cx="190" cy="140" r="15" fill="#00ffd0" filter="url(#cGlow)"/>
    <circle cx="250" cy="290" r="12" fill="#00ffd0" filter="url(#cGlow)"/>
    <circle cx="310" cy="140" r="15" fill="#00ffd0" filter="url(#cGlow)"/>
    <circle cx="370" cy="240" r="13" fill="#00ffd0" filter="url(#cGlow)"/>
  </g>

  <!-- Divider Line -->
  <line x1="330" y1="70" x2="330" y2="230" stroke="#1f334d" stroke-width="2"/>

  <!-- Brand Typography -->
  <!-- WYLSOF -->
  <text x="375" y="160" font-family="'Inter', 'Space Grotesk', 'Montserrat', -apple-system, sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="4">WYLSOF</text>
  
  <!-- Tagline -->
  <text x="378" y="208" font-family="'Inter', 'Space Grotesk', -apple-system, sans-serif" font-size="17" font-weight="600" fill="#8ba1b7" letter-spacing="4.8">ENGINEERING IDEAS INTO INTELLIGENT PRODUCTS</text>
</svg>
